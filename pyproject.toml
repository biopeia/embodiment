[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodiment"
version = "0.1.0a1"
description = "Biopeia Embodiment migration candidate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rfc8785>=0.1.4,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
